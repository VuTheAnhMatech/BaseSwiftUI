interface:
  display_name: "BaseSwiftUI Figma UI"
  short_description: "Build fast, high-fidelity BaseSwiftUI UI from Figma"
  default_prompt: "Use $baseswiftui-figma-ui quick for a local View or screen for existing-pattern wiring. Reuse valid evidence, resolve only concrete gaps, verify asset matches, and rebuild after further Swift edits. Use flow for multiple screens or changed contracts/data behavior."

dependencies:
  tools:
    - type: "mcp"
      value: "figma"
      description: "Official Figma MCP server"

policy:
  allow_implicit_invocation: true
