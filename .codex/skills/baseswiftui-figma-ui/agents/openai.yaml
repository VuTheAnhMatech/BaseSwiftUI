interface:
  display_name: "BaseSwiftUI Figma UI"
  short_description: "Draft or build BaseSwiftUI UI from Figma"
  default_prompt: "Use $baseswiftui-figma-ui to draft one fast local View or implement this Figma MCP node/flow in BaseSwiftUI."

dependencies:
  tools:
    - type: "mcp"
      value: "figma"
      description: "Official Figma MCP server"

policy:
  allow_implicit_invocation: true
